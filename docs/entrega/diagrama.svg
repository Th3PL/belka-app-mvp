<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5FD0"/></marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#c9d0dc;stroke-width:1.2;rx:8}
    .t{fill:#17243a;font-weight:600}
    .s{fill:#4a5468;font-size:10.5px}
    .zone{fill:#f4f6fa;stroke:#c9d0dc;stroke-dasharray:5 4;rx:12}
    .zt{fill:#0B1B34;font-weight:700;font-size:12.5px}
    .ln{stroke:#4a5468;stroke-width:1.4;fill:none;marker-end:url(#a)}
    .lb{stroke:#2F5FD0;stroke-width:1.6;fill:none;marker-end:url(#ab)}
    .tag{fill:#4a5468;font-size:10px}
  </style>

  <!-- GitHub -->
  <rect class="zone" x="10" y="10" width="880" height="150"/>
  <text class="zt" x="24" y="32">GitHub · Th3PL/belka-app-mvp (público)</text>
  <rect class="box" x="24" y="48" width="96" height="44"/><text class="t" x="72" y="68" text-anchor="middle">git push</text><text class="s" x="72" y="83" text-anchor="middle">main / branches</text>
  <text class="zt" x="150" y="62" font-size="11">GitHub Actions — devsecops.yml (a cada push)</text>
  <rect class="box" x="150" y="72" width="88" height="40" style="fill:#fff3f1"/><text class="t" x="194" y="90" text-anchor="middle">Gitleaks</text><text class="s" x="194" y="104" text-anchor="middle">segredos</text>
  <rect class="box" x="150" y="114" width="88" height="34" style="fill:#fff3f1"/><text class="t" x="194" y="135" text-anchor="middle">Semgrep</text>
  <rect class="box" x="260" y="82" width="84" height="44"/><text class="t" x="302" y="101" text-anchor="middle">Build</text><text class="s" x="302" y="116" text-anchor="middle">Docker</text>
  <rect class="box" x="366" y="82" width="96" height="44" style="fill:#fff3f1"/><text class="t" x="414" y="101" text-anchor="middle">Trivy</text><text class="s" x="414" y="116" text-anchor="middle">imagem + config</text>
  <rect class="box" x="484" y="82" width="90" height="44"/><text class="t" x="529" y="101" text-anchor="middle">Push GHCR</text><text class="s" x="529" y="116" text-anchor="middle">tag = SHA</text>
  <rect class="box" x="596" y="82" width="132" height="44" style="fill:#edf2ff"/><text class="t" x="662" y="101" text-anchor="middle">terraform apply</text><text class="s" x="662" y="116" text-anchor="middle">login OIDC · env production</text>
  <rect class="box" x="750" y="82" width="124" height="44"/><text class="t" x="812" y="101" text-anchor="middle">Teste de fumaça</text><text class="s" x="812" y="116" text-anchor="middle">GET /health</text>
  <path class="ln" d="M120 70 H140 V92 H150"/>
  <path class="ln" d="M238 92 H260"/><path class="ln" d="M238 131 H250 V110 H260"/>
  <path class="ln" d="M344 104 H366"/><path class="ln" d="M462 104 H484"/><path class="ln" d="M574 104 H596"/><path class="ln" d="M728 104 H750"/>
  <text class="tag" x="24" y="118">GitHub Secrets:</text><text class="tag" x="24" y="132">AZURE_* (OIDC)</text><text class="tag" x="24" y="146">ALERT_EMAIL</text>
  <!-- imagens publicadas no GHCR -->
  <path class="ln" style="stroke-dasharray:4 3" d="M529 82 V70 H882 V442 H874"/><text class="tag" x="760" y="66">imagens</text>

  <!-- Azure -->
  <rect class="zone" x="10" y="186" width="660" height="364"/>
  <text class="zt" x="24" y="208">Azure · rg-belka · Brazil South</text>
  <rect class="zone" x="24" y="220" width="400" height="190" style="fill:#fff"/>
  <text class="zt" x="38" y="240" font-size="11.5">Container Apps Environment (sem VM, sem SSH)</text>
  <rect class="box" x="40" y="256" width="170" height="136" style="fill:#edf2ff;stroke:#2F5FD0"/>
  <text class="t" x="125" y="278" text-anchor="middle">belka-api</text>
  <text class="s" x="125" y="296" text-anchor="middle">FastAPI + front-end</text>
  <text class="s" x="125" y="312" text-anchor="middle">0,5 vCPU · 1 GiB · 1–3 réplicas</text>
  <text class="s" x="125" y="328" text-anchor="middle">usuário 10001 (não root)</text>
  <text class="s" x="125" y="350" text-anchor="middle" style="fill:#1d7a46;font-weight:600">ingress EXTERNO</text>
  <text class="s" x="125" y="365" text-anchor="middle">HTTPS 443 · HTTP→301</text>
  <rect class="box" x="240" y="256" width="170" height="136"/>
  <text class="t" x="325" y="278" text-anchor="middle">belka-ollama</text>
  <text class="s" x="325" y="296" text-anchor="middle">qwen2.5:1.5b + proxy Caddy</text>
  <text class="s" x="325" y="312" text-anchor="middle">2 vCPU · 4 GiB · 0–1 réplica</text>
  <text class="s" x="325" y="328" text-anchor="middle">escala a zero</text>
  <text class="s" x="325" y="350" text-anchor="middle" style="fill:#b42318;font-weight:600">proxy exige Bearer token</text>
  <text class="s" x="325" y="365" text-anchor="middle">sem token → 401 · Ollama em 127.0.0.1</text>
  <path class="lb" d="M210 324 H240"/><text class="tag" x="212" y="318">HTTPS</text>

  <rect class="box" x="24" y="428" width="150" height="54"/><text class="t" x="99" y="450" text-anchor="middle">Application Insights</text><text class="s" x="99" y="466" text-anchor="middle">OpenTelemetry, IP mascarado</text>
  <rect class="box" x="190" y="428" width="120" height="54"/><text class="t" x="250" y="450" text-anchor="middle">Log Analytics</text><text class="s" x="250" y="466" text-anchor="middle">30 dias · 1 GB/dia</text>
  <rect class="box" x="326" y="428" width="160" height="54"/><text class="t" x="406" y="450" text-anchor="middle">Workbook</text><text class="s" x="406" y="466" text-anchor="middle">4 sinais de ouro</text>
  <rect class="box" x="502" y="428" width="154" height="54"/><text class="t" x="579" y="450" text-anchor="middle">Alertas → e-mail</text><text class="s" x="579" y="466" text-anchor="middle">erros 5xx · CPU</text>
  <path class="ln" d="M100 392 V428"/><text class="tag" x="104" y="414">telemetria sem query string</text>
  <path class="ln" d="M174 455 H190"/><path class="ln" d="M310 455 H326"/>
  <path class="ln" d="M150 482 V500 H579 V482"/>
  <text class="tag" x="24" y="532">Imagens puxadas do GHCR · secrets do Container App (App Insights, Databricks opcional)</text>

  <rect class="box" x="446" y="256" width="210" height="62" style="fill:#fafbfd"/>
  <text class="t" x="551" y="278" text-anchor="middle">rg-belka-tfstate</text>
  <text class="s" x="551" y="294" text-anchor="middle">Storage: terraform state (sem chave)</text>
  <text class="s" x="551" y="309" text-anchor="middle">Managed Identity OIDC (menor privilégio)</text>
  <path class="ln" d="M640 126 V256"/><text class="tag" x="645" y="208">state</text>
  <path class="lb" d="M600 126 V200 H380 V220"/><text class="tag" x="440" y="195">terraform cria/atualiza</text>

  <!-- Externos -->
  <rect class="zone" x="690" y="186" width="200" height="364"/>
  <text class="zt" x="704" y="208">Externos</text>
  <rect class="box" x="706" y="226" width="168" height="54" style="fill:#fff8eb"/><text class="t" x="790" y="248" text-anchor="middle">Cidadão (celular)</text><text class="s" x="790" y="264" text-anchor="middle">navegador, HTTPS</text>
  <rect class="box" x="706" y="300" width="168" height="44"/><text class="t" x="790" y="318" text-anchor="middle">Open-Meteo</text><text class="s" x="790" y="333" text-anchor="middle">previsão (coords ~1 km)</text>
  <rect class="box" x="706" y="360" width="168" height="44"/><text class="t" x="790" y="378" text-anchor="middle">Databricks SQL</text><text class="s" x="790" y="393" text-anchor="middle">camada Ouro (opcional)</text>
  <rect class="box" x="706" y="420" width="168" height="44"/><text class="t" x="790" y="438" text-anchor="middle">GHCR</text><text class="s" x="790" y="453" text-anchor="middle">belka-api · belka-ollama</text>
  <path class="lb" d="M706 249 H180 V256"/><text class="tag" x="560" y="244">HTTPS</text>
  <path class="ln" d="M190 392 V418 H690 V322 H706"/>
  <path class="ln" d="M690 382 H706"/><text class="tag" x="470" y="414">chamadas de saída (HTTPS)</text>
</svg>
