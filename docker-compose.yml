# Stack local completa: API + LLM (Ollama com qwen2.5:1.5b embutido).
#   docker compose up --build
#   http://localhost:8000
# Variáveis vêm do arquivo .env, que NÃO é versionado. Antes do primeiro "up":
#   echo "OLLAMA_API_KEY=$(openssl rand -hex 32)" >> .env
services:
  api:
    build: .
    image: belka-api:local
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_URL: http://ollama:8080
      OLLAMA_MODEL: qwen2.5:1.5b
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:?defina OLLAMA_API_KEY no .env (veja o topo deste arquivo)}
    depends_on:
      ollama:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ollama:
    build: ./ollama
    image: belka-ollama:local
    # Sem "ports": o LLM só é acessível pela rede interna do compose, e ainda exige o token.
    environment:
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:?defina OLLAMA_API_KEY no .env (veja o topo deste arquivo)}
    healthcheck:
      test: ["CMD", "sh", "-c", "OLLAMA_HOST=127.0.0.1:11434 ollama list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
